<style>
:root {
  --ground: #f2f4f1; --surface: #ffffff; --ink: #17201c; --muted: #56645f; --line: #d5ddd8;
  --accent: #1e6b57; --accent-soft: #e2efe9;
  --done: #2f7a4b; --doing: #a86400; --wait: #b8432e; --left: #7f8b85;

  --fog: rgba(127, 139, 133, .10);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;

    color-scheme: dark;

    --accent: #5cc4a6; --accent-soft: #1b3129;
    --done: #6cc38b; --doing: #e6a23c; --wait: #ef7f68; --left: #76837d;
    --done-soft: #1a2e22; --doing-soft: #33260f; --wait-soft: #3a1d17; --left-soft: #1e2623;
    --fog: rgba(154, 168, 162, .08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #101613; --surface: #17201c; --ink: #e5ebe7; --muted: #9aa8a2; --line: #2a3631;
  --accent: #5cc4a6; --accent-soft: #1b3129;
  --done: #6cc38b; --doing: #e6a23c; --wait: #ef7f68; --left: #76837d;
  --done-soft: #1a2e22; --doing-soft: #33260f; --wait-soft: #3a1d17; --left-soft: #1e2623;
  --fog: rgba(154, 168, 162, .08);

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body); margin: 0; padding-inline: 16px; padding-block: 28px 56px; }
main { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
code { font: 500 .86em var(--mono); background: var(--left-soft); padding: .08em .35em; border-radius: 4px; }
.label { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
section { display: grid; gap: 12px; }
.head { display: grid; gap: 10px; }
.goal { font-size: 1.15rem; max-width: 62ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; color: var(--muted); }
.changes { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .86rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }

/* You are here */
.here { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
.here .where { font-family: var(--display); font-size: 1.35rem; font-weight: 600; }
.trail { display: flex; gap: 3px; height: 12px; }
.trail span { flex: 1; border-radius: 2px; background: var(--left-soft); background-image: repeating-linear-gradient(135deg, var(--fog) 0 4px, transparent 4px 8px); }
.trail span.d { background: var(--done); }
.trail span.g { background: var(--doing); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%; margin-right: .4em; vertical-align: .05em; }
.dot.done { background: var(--done); } .dot.doing { background: var(--doing); } .dot.left { background: var(--left); } .dot.wait { background: var(--wait); }
.now { border-top: 1px solid var(--line); padding-top: 12px; }

/* Waiting on you */
.ask { background: var(--wait-soft); border: 1px solid var(--wait); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
.ask .q { font-weight: 700; font-size: 1.08rem; }
.ctx { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: .95rem; }
.ctx dt { font-weight: 700; color: var(--muted); }
.ctx dd { margin: 0; }
.opts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.opts li { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.opts li.rec { border-color: var(--accent); }
.badge { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }

/* Board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .board { grid-template-columns: 1fr; } }
.col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.col h3 { display: flex; align-items: center; justify-content: space-between; }
.col h3 small { font: 400 .85rem var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.col.left { background-image: repeating-linear-gradient(135deg, var(--fog) 0 6px, transparent 6px 14px); }
.col.left .item { color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.item { font-size: .95rem; }
.item details summary { cursor: pointer; }
.item details summary::after { content: " +"; color: var(--accent); font-weight: 700; }
.item details[open] summary::after { content: " \2212"; }
.item .more { font-size: .9rem; color: var(--muted); padding: 4px 0 2px 1.1em; }

/* Threads */
.thread { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.thread > summary { padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.thread > div { padding: 0 14px 14px; display: grid; gap: 8px; }
.pill { font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.doing { background: var(--doing-soft); color: var(--doing); }
.pill.blocked, .pill.open { background: var(--wait-soft); color: var(--wait); }
.pill.parked, .pill.locked { background: var(--left-soft); color: var(--muted); }
.pill.locked { color: var(--done); background: var(--done-soft); }

/* Folded sections */
details summary { list-style: none; }
details summary::-webkit-details-marker { display: none; }
.fold { border-top: 1px solid var(--line); padding-top: 14px; }
.fold > summary { cursor: pointer; display: flex; align-items: baseline; gap: 10px; }
.fold > summary h2::before, .thread > summary::before, .idea > summary::before {
  content: "\25B8"; display: inline-block; width: 1em; color: var(--accent); transition: transform .15s;
}
.fold[open] > summary h2::before, .thread[open] > summary::before, .idea[open] > summary::before { transform: rotate(90deg); }
.fold > div { padding-top: 12px; display: grid; gap: 10px; }
summary:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td.code { font: 500 .88rem var(--mono); white-space: nowrap; color: var(--accent); }
.dec { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; align-items: baseline; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.idea > summary { cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 1em 1fr; gap: 2px 0; }
.idea > summary > * { grid-column: 2; }
.idea > summary::before { grid-row: 1; grid-column: 1; }
.idea .layer { padding: 0 14px 14px 30px; display: grid; gap: 8px; }
.idea .deep { border-left: 3px solid var(--accent-soft); padding-left: 12px; }
.idea .deep summary { cursor: pointer; color: var(--accent); font-weight: 700; font-size: .9rem; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 700 .82rem var(--body); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.next { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .next { grid-template-columns: 1fr; } }
.next > div { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.next > div.you { border-left-color: var(--wait); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.phase { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.phase > summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.phase > summary::before { content: "\25B8"; display: inline-block; width: 1em; color: var(--accent); transition: transform .15s; }
.phase[open] > summary::before { transform: rotate(90deg); }
.phase .tally { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; }
.row { display: grid; grid-template-columns: 1.2em max-content 1fr; gap: 0 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: .95rem; }
.row .id { font: 500 .8rem var(--mono); color: var(--accent); }
.row.left .t { color: var(--muted); }
.row.done .t { color: var(--muted); }
.row .src { font-size: .72rem; font-weight: 700; color: var(--doing); margin-left: 6px; text-transform: uppercase; letter-spacing: .05em; }
.row details summary { cursor: pointer; }
.row details summary::after { content: " +"; color: var(--accent); font-weight: 700; }
.row details[open] summary::after { content: " \2212"; }
.row .more { color: var(--muted); font-size: .9rem; padding-top: 2px; }
.dot.you { background: var(--wait); }
.coverage { font-size: .9rem; padding: 8px 12px; border-radius: 8px; background: var(--done-soft); }
.coverage.gap { background: var(--wait-soft); }
footer { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
